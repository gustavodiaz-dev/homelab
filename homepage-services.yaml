- Proxmox:
    - ProxMenux Monitor:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/proxmenux.png
        href: http://monitor.lab
        description: Proxmox host health
        ping: 192.168.18.15
        widget:
          type: customapi
          url: http://192.168.18.15:8008/api/system
          headers:
            Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6ImFkbWluIiwiZXhwIjoxODEyMDc3ODYxLCJpYXQiOjE3ODA1NDE4NjEsImlzcyI6InByb3htZW51eC1tb25pdG9yIiwiYXVkIjoiYXBpIn0.14ZYqAMqu7N4cuvYkbpit8oz78vjRNWJLWGP6r9hvqw"
          refreshInterval: 10000
          mappings:
            - field: uptime
              label: Uptime
              icon: lucide:clock-4
              format: text
            - field: cpu_usage
              label: CPU
              icon: lucide:cpu
              format: percent
            - field: memory_usage
              label: RAM
              icon: lucide:memory-stick
              format: percent
            - field: temperature
              label: Temp
              icon: lucide:thermometer-sun
              format: number
              suffix: °C

